services:
  - type: web
    name: highwatch-rag
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /status
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: "groq"
      - key: EMBEDDING_PROVIDER
        value: "gemini"
      - key: STORAGE_DIR
        value: "storage"
      - key: DOWNLOAD_DIR
        value: "downloads"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "8000"
