services:
  - type: web
    name: highwatch-rag
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /status
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://highwatch-rag.onrender.com/auth/callback"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: "groq"
      - key: STORAGE_DIR
        value: "/data/storage"
      - key: DOWNLOAD_DIR
        value: "/data/downloads"
    disk:
      name: rag-data
      mountPath: /data
      sizeGB: 1
